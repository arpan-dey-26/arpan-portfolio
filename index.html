<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050816" />

    <title>%VITE_SITE_TITLE%</title>
    <meta name="description" content="%VITE_SITE_DESCRIPTION%" />
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- Open Graph — Architecture §19 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VITE_SITE_TITLE%" />
    <meta property="og:description" content="%VITE_SITE_DESCRIPTION%" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%%VITE_OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_SITE_TITLE%" />
    <meta name="twitter:description" content="%VITE_SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%VITE_SITE_URL%%VITE_OG_IMAGE%" />

    <!--
      Favicon — placeholder paths. Add the real files to public/favicon/
      (see README.md → "Assets you still need to add").
    -->
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />

    <!--
      Geist (primary) + JetBrains Mono (code/tags) via Google Fonts.
      Confirmed both are hosted there directly: fonts.google.com/specimen/Geist
      and fonts.google.com/specimen/JetBrains+Mono. Deliberately JetBrains
      Mono, not Geist Mono — the Design System's original choice was two
      distinct families, not Geist's own unified Sans+Mono pairing, and
      this preserves that exact decision rather than substituting a
      different (if related) font.
      Replaces the original self-hosted @font-face setup (src/styles/fonts.css)
      — those binary files were never actually provided (this environment
      has no network access to fetch them), which is what caused the
      production 404s. Same fonts, same weights, different delivery
      mechanism — no typographic change.
      Weights requested match what's actually used in this codebase
      (font-medium/500, font-semibold/600, default/400), plus 700 as a
      small buffer.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Person schema (Architecture §19). Sourced from
      MASTER_PORTFOLIO_DATA.md — full name, headline, verified profile
      URLs, and city-level location. No fields here are guessed.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Arpan Dey",
        "url": "%VITE_SITE_URL%",
        "jobTitle": "Software Engineer | Java Developer | AI & Full-Stack Developer",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Kolkata",
          "addressRegion": "West Bengal",
          "addressCountry": "India"
        },
        "sameAs": [
          "https://github.com/arpan-dey-26",
          "https://www.linkedin.com/in/arpan-dey26",
          "https://x.com/ArpanDeydev",
          "https://leetcode.com/u/arpan_dey12/"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
